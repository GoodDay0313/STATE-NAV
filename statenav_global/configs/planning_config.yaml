seed: 0


# Environment and Start and Goal
env_extent: [-7, 7, -7, 7] # [xmin, xmax, ymin, ymax]
# environment extent should be slightly larger than task extent
# otherwise, the robot might go out of boundary and cannot access matrix value
# If env or global start becomes 0 if gets weird. 

initial_start:   [-6, 0]
global_goal:    [3, 0] 
heading_start:  0


# Hills
# [-4.5, 1]
# [3.5, 0.5]
# 0
# Const
# [1, -4.5]
# [1.5, 4.5] 
# 90
# urban
# [4.4, 4.6]
# [-4, 0]   
# -135
# showcase
# [-4.5, 4.5]
# [4.5, -4.5]   
# -45

# Hardware
# [0, 0]
# [5, 0]   
# 0


savemap: 1 # save the map as png once
debugging_visualization: true
map_visualization_interval: 1.0  # seconds between map visualization updates


####################### Mapping Configurations #######################
# Mapping
trav_estimation_resoultion: 0.5 # m
local_patch_size: 0.64  # m

# ROS-related
frame_id: 'map' # World frame id
which_layer: ['min_filter', 'inpaint']
# which_layer: ['smooth']
mean_over_maps: True # If false, the first layer is used for data and the second layer is used for deciding if it is NaN

elevation_diff_threshold: 0.03
RandomRate_TravUpdate: 0.3
initialization_time: 1

# ROS Publishing
use_gridmap_msg: 1  # True for GridMap, False for Float32MultiArray
pub_travmap_visualization: True  # publish /travmap_visualization GridMap (elevation + north cmd_v) for Rviz2, at max 0.5 Hz

# Traversability 
# The default planner option is safecmd mode
trav_option: 'Proposed' 

# safe cmd planner
maximum_cmd_v: 2
maximum_cmd_w: 1
default_safe_cmd_v: 1.0 # Should not be an integer multiplier of v_res = maximum_cmd_v/num_commands
default_safe_cmd_w: 0.5
toorisky_v: 0.0000001
toorisky_w: 0.0000001
TreatObs_cmd_v: 0.3
num_commands: 10

instability_limit: 1.25
instability_std_multiplier: 2.06

####################### Hardware Configurations #######################
# Perception
ptcloud_publishers_list:  ['zed'] #['lidar', 'depth_shoulder', 'depth_torso'] #, 'zed']

yaw_offset: 1.353
pos_offset: [0, 0, 1]
# If Digit pose is [r, p, y, a, b, c]
# then -> yaw = -y, pos = (0,0,h) - (a,b,c)


####################### Planning Configurations #######################

## Planning
use_shared_memory: True
# if True, planner reads maps from shared memory (multiprocess mode). 
# If False, uses ROS topics (single process mode)
# Start WorldModel first. PlanningNode attaches to shared memory that WorldModel creates — it will crash if that memory doesn't exist yet.



# RRT*
goal_radius_ratio: 0.05 # ratio of the goal radius to the environment extent

switch_to_informed_from_thisiter: 480 # if 0, vanilla RRT is used
iter_max: 500
branch_length_max_ratio: 0.1
search_radius_ratio: 0.8
convergence_ratio: 0.00000001



sampling_dist: 0.1  # m
num_samplingpoints: None



## MPC
MPC_horizon: 7
robust_horizon: 0

ub_u_ddtheta: 0.03

# waypoint
getwaypoint_ratio: 1.2


# get_cmd_limit
lookahead_angle: 30 # deg
safecmd_sampling_dist: 0.1

# debug
debug_print: 0
print_until_t: 5
global_view: False
local_view_radius: 3.4

obs_clearance: 0.1  # m — geometric clearance margin for RRT edge collision checks

#######################  Planner timing / lookahead ######################

# Nominal control-loop period (s); used as reference dt in PurePursuitPlanner.__init__
step_T: 0.45

# Total lookahead time (s) passed to get_waypoint(); projected to a distance via current cmd_v_limit
waypoint_lookahead_time: 1

# Lookahead distance (m) used by the proportional controller in interaction mode to select a local target
lookahead_distance: 1.5

